<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resource Mapping - विपद्Sathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="authority.css">
    <style>
        .resource-content{max-width:1440px}.resource-hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:28px}.resource-hero h1{margin:7px 0 8px}.resource-hero p{max-width:670px;margin:0;color:var(--muted)}.resource-status{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;white-space:nowrap}.resource-status i,.resource-live{width:7px;height:7px;border-radius:50%;background:#4d8a63;box-shadow:0 0 0 4px rgba(77,138,99,.13)}.resource-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:28px}.resource-action{display:flex;align-items:center;gap:18px;padding:22px 24px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}.resource-action:hover{border-color:var(--red);box-shadow:var(--shadow);transform:translateY(-2px)}.resource-action .action-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--red-soft);color:var(--red);font-size:25px}.resource-action.have .action-icon{background:var(--green-soft);color:var(--green)}.resource-action strong{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600}.resource-action small{display:block;color:var(--muted);margin-top:3px}.resource-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:20px}.resource-panel{padding:24px;background:var(--surface);border:1px solid var(--line)}.resource-panel h2{margin:4px 0 6px;font:600 25px Fraunces,Georgia,serif}.resource-panel .panel-copy{margin:0 0 18px;color:var(--muted);font-size:12px}.resource-list{display:grid;gap:10px}.resource-card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px;border:1px solid var(--line);background:#fff}.resource-card .resource-symbol{display:grid;place-items:center;width:42px;height:42px;background:var(--green-soft);color:var(--green);font-size:19px}.resource-card h3{margin:0;font-size:14px}.resource-card p{margin:3px 0 0;color:var(--muted);font-size:11px}.resource-card .quantity{text-align:right;color:var(--green);font-weight:700;font-size:14px}.resource-card .quantity small{display:block;color:var(--muted);font-size:10px;font-weight:500}.resource-card button,.resource-btn{border:1px solid var(--green);background:var(--green);color:#fff;padding:9px 13px;cursor:pointer;font-size:11px;font-weight:700}.resource-card button{margin-top:7px;background:transparent;color:var(--green)}.resource-card button:hover{background:var(--green);color:#fff}.activity-list{display:grid;gap:0}.activity-item{padding:14px 0;border-bottom:1px solid var(--line)}.activity-item:last-child{border-bottom:0}.activity-item strong{display:block;font-size:12px}.activity-item span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.activity-item b{display:inline-block;margin-top:8px;padding:3px 7px;background:var(--amber-soft);color:var(--amber);font-size:9px;letter-spacing:.06em;text-transform:uppercase}.resource-back{border:0;background:none;color:var(--green);padding:0;cursor:pointer;font-size:12px;font-weight:700}.resource-form{max-width:900px}.resource-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.resource-form label{display:grid;gap:6px;color:var(--muted);font-size:11px;font-weight:700}.resource-form input,.resource-form select,.resource-form textarea,.chat-compose input{width:100%;border:1px solid var(--line-strong);background:#fffdfa;color:var(--ink);padding:11px 12px;outline:none}.resource-form textarea{min-height:100px;resize:vertical}.resource-form input:focus,.resource-form select:focus,.resource-form textarea:focus,.chat-compose input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}.field-wide{grid-column:1/-1}.form-actions{display:flex;align-items:center;gap:14px;margin-top:22px}.resource-btn.secondary{background:transparent;color:var(--green);border-color:var(--line-strong)}.resource-btn:hover{filter:brightness(1.08)}.match-list{display:grid;gap:12px;margin-top:18px}.match-card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);background:#fff}.match-card .resource-symbol{display:grid;place-items:center;width:48px;height:48px;background:var(--green-soft);color:var(--green);font-size:21px}.match-card h3{margin:0;font-size:15px}.match-card p{margin:4px 0 0;color:var(--muted);font-size:12px}.match-card .match-quantity{color:var(--green);font-weight:700;text-align:right}.match-card .match-quantity small{display:block;color:var(--muted);font-size:10px;font-weight:500}.match-card button{display:block;margin-top:9px;margin-left:auto}.detail-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr);gap:20px}.detail-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.detail-list div{padding:13px;background:var(--surface-muted)}.detail-list span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.detail-list strong{display:block;margin-top:4px;font-size:13px}.connection-state{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.connection-state .resource-live{background:var(--amber)}.chat-window{max-width:760px;border:1px solid var(--line);background:var(--surface)}.chat-header{display:flex;justify-content:space-between;gap:14px;padding:17px 20px;border-bottom:1px solid var(--line)}.chat-header strong{display:block;font-size:13px}.chat-header small{display:block;color:var(--muted);font-size:11px}.chat-messages{display:grid;gap:12px;padding:24px;min-height:270px;background:#f3efe8}.chat-bubble{max-width:70%;padding:11px 13px;font-size:12px;line-height:1.45;background:#fff;border:1px solid var(--line)}.chat-bubble small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.chat-bubble.mine{justify-self:end;background:var(--green);border-color:var(--green);color:#fff}.chat-bubble.mine small{color:#d5e2d9}.chat-compose{display:flex;gap:9px;padding:14px;border-top:1px solid var(--line)}.chat-compose button{border:0;background:var(--red);color:#fff;padding:0 17px;cursor:pointer;font-weight:700}.resource-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.resource-tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:11px;font-weight:700}.resource-tab.active{background:var(--green);border-color:var(--green);color:#fff}.empty-state{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);font-size:12px}@media(max-width:820px){.resource-grid,.detail-layout{grid-template-columns:1fr}.resource-hero{display:block}.resource-status{margin-top:14px}.authority-content{padding:28px 20px}.resource-actions{grid-template-columns:1fr}}@media(max-width:620px){.resource-form-grid,.detail-list{grid-template-columns:1fr}.resource-card,.match-card{grid-template-columns:40px minmax(0,1fr)}.resource-card .quantity,.match-card .match-quantity{grid-column:2;text-align:left}.resource-card button,.match-card button{margin-left:0}.chat-bubble{max-width:88%}}
    </style>
</head>
<body class="authority-app">
<header class="authority-header"><a href="response-dashboard.html" class="authority-brand"><span class="brand-mark">R</span><span><b>विपद्Sathi</b><small>RESOURCE NETWORK</small></span></a><div class="authority-header-right"><span class="header-area">Kathmandu Valley</span><a class="authority-user" href="authority-profile.html"><span>AS</span><strong>Alex Sharma</strong><small>Response member</small></a><a class="header-logout" href="login-page.html">Log out</a></div></header>
<main class="authority-layout">
<aside class="authority-sidebar"><div class="sidebar-caption">Resource network</div><nav><a href="response-dashboard.html">Overview</a><a class="active" href="resource-mapping.html">Resource Mapping</a><a href="available-resources.html">Available Resources</a><a href="live-cameras.html">Live Cameras</a><a href="incident-alerts.html">Incident Alerts <b>4</b></a><a href="live-map.html">Live Map</a><a href="incident-history.html">Incident History</a><div class="sidebar-rule"></div><a href="camera-alert-emails.html">Alert Emails</a><a href="authority-profile.html">Profile</a><a href="authority-settings.html">Settings</a></nav><div class="sidebar-footer"><span class="online-dot"></span>Network operational<small>Last sync 18:42:09</small></div></aside>
<section class="authority-content resource-content" id="resourceApp"></section>
</main>
<script src="authority.js"></script>
<script>
(() => {
    const root = document.getElementById('resourceApp');
    const icons = {blood:'+', food:'▦', water:'◒', medicine:'✚', shelter:'⌂', equipment:'◇'};
    const resources = [
        {id:'r1',type:'Blood',specific:'O− blood',quantity:8,unit:'units',location:'Lalitpur',provider:'Patan Community Hospital',details:'Cross-matched and stored. Available for urgent transfer.',availability:'Available now'},
        {id:'r2',type:'Food packages',specific:'Family food packages',quantity:120,unit:'packages',location:'Kathmandu',provider:'Nepal Relief Collective',details:'Rice, lentils, oil and salt for a family of four.',availability:'Available now'},
        {id:'r3',type:'Drinking water',specific:'20L water containers',quantity:60,unit:'containers',location:'Bhaktapur',provider:'Bhaktapur Youth Network',details:'Sealed drinking water for evacuation points.',availability:'Available today'},
        {id:'r4',type:'Medical supplies',specific:'First-aid kits',quantity:25,unit:'kits',location:'Kirtipur',provider:'Sajilo Care',details:'Bandages, antiseptic, gloves and basic trauma supplies.',availability:'Available now'},
        {id:'r5',type:'Equipment',specific:'Rescue drones',quantity:2,unit:'drones',location:'Kathmandu',provider:'Himalayan Search Unit',details:'Thermal camera drones with trained operators.',availability:'Available on request'}
    ];
    let state = {view:'home', request:null, selected:null, activity:'requests'};
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const symbol = type => icons[type.toLowerCase().split(' ')[0]] || '◇';
    const availableCard = item => `<article class="resource-card"><span class="resource-symbol">${symbol(item.type)}</span><div><h3>${esc(item.specific)}</h3><p>${esc(item.provider)} · ${esc(item.location)} · ${esc(item.availability)}</p></div><div class="quantity">${item.quantity} <small>${esc(item.unit)} available</small><button data-view="details" data-id="${item.id}">View Details</button></div></article>`;
    const shell = (eyebrow,title,copy,body) => `<div class="resource-hero"><div><button class="resource-back" data-view="home">← Resource Mapping</button><span class="eyebrow" style="display:block;margin-top:14px">${eyebrow}</span><h1>${title}</h1><p>${copy}</p></div><span class="resource-status"><i></i> Live community network</span></div>${body}`;
    const home = () => `<div class="resource-hero"><div><span class="eyebrow">Shared emergency capacity</span><h1>Resource Mapping</h1><p>Find what your community needs, offer what you can, and coordinate every exchange directly with the provider.</p></div><span class="resource-status"><i></i> Live community network</span></div><div class="resource-actions"><button class="resource-action" data-view="need"><span class="action-icon">＋</span><span><strong>I Need Something</strong><small>Post a request and review potential matches.</small></span></button><button class="resource-action have" data-view="have"><span class="action-icon">↗</span><span><strong>I Have Something</strong><small>Offer an emergency resource to people nearby.</small></span></button></div><div class="resource-grid"><section class="resource-panel"><span class="eyebrow">Community supply board</span><h2>Available Resources</h2><p class="panel-copy">Resources currently offered by verified people and organizations. Choosing a resource never creates a connection automatically.</p><div class="resource-list">${resources.slice(0,4).map(availableCard).join('')}</div><button class="text-link" style="border:0;background:none;padding:16px 0 0;cursor:pointer" data-view="available">View all available resources <span>→</span></button></section><aside class="resource-panel"><span class="eyebrow">Your activity</span><h2>My Resource Activity</h2><p class="panel-copy">Track requests, offers, connections, chats, and fulfilled exchanges.</p><div class="activity-list"><div class="activity-item"><strong>O− blood request</strong><span>5 units · Kathmandu · 2 potential matches</span><b>Potential matches</b></div><div class="activity-item"><strong>Family food packages</strong><span>20 packages · Kathmandu</span><b style="background:var(--green-soft);color:var(--green)">Available resource</b></div><div class="activity-item"><strong>Water delivery · Lalitpur</strong><span>8 containers connected to Maya Relief</span><b style="background:var(--red-soft);color:var(--red)">In coordination</b></div></div><button class="text-link" style="border:0;background:none;padding:16px 0 0;cursor:pointer" data-view="activity">Open My Resource Activity <span>→</span></button></aside></div>`;
    const form = mode => shell(mode === 'need' ? 'Request support' : 'Offer support', mode === 'need' ? 'I Need Something' : 'I Have Something', mode === 'need' ? 'Describe what is needed so nearby providers can review your request.' : 'List an available resource so people and response teams can coordinate with you.', `<section class="resource-panel resource-form"><form id="resourceForm"><div class="resource-form-grid"><label>Resource type<select name="type" required><option value="">Select a resource type</option><option>Blood</option><option>Food packages</option><option>Medicines</option><option>Drinking water</option><option>Blankets</option><option>Tents</option><option>Medical supplies</option><option>Drones</option><option>Boats</option><option>Vehicles</option><option>Other emergency resources</option></select></label><label>Specific type<input name="specific" required placeholder="e.g. O− blood, 20L water containers"></label><label>${mode === 'need' ? 'Quantity needed' : 'Quantity available'}<input name="quantity" type="number" min="1" required placeholder="Enter quantity"></label><label>Unit<select name="unit" required><option value="">Select a unit</option><option>units</option><option>packages</option><option>containers</option><option>kits</option><option>vehicles</option><option>items</option><option>people</option></select></label><label>Location<input name="location" required placeholder="City, ward or landmark"></label>${mode === 'have' ? '<label>Availability<select name="availability"><option>Available now</option><option>Available today</option><option>Available on request</option><option>Limited availability</option></select></label>' : ''}<label class="field-wide">Optional details<textarea name="details" placeholder="Add timing, access instructions, eligibility, or other useful details"></textarea></label></div><div class="form-actions"><button class="resource-btn" type="submit">Post ${mode === 'need' ? 'Request' : 'Available Resource'} <span>→</span></button><button class="resource-btn secondary" type="button" data-view="home">Cancel</button></div></form></section>`);
    const matches = () => { const r = state.request; const found = resources.filter(item => item.type.toLowerCase() === r.type.toLowerCase() && item.specific.toLowerCase() === r.specific.toLowerCase() && item.quantity >= Number(r.quantity)); return shell('Request posted', 'Potential Matches', `Available ${r.specific} that meet your request for ${r.quantity} ${r.unit} in ${r.location}. You choose whether to connect; nothing is automatic.`, `<section class="resource-panel"><div class="connection-state"><i class="resource-live"></i>${found.length} potential match${found.length === 1 ? '' : 'es'}</div><div class="match-list">${(found.length ? found : resources.filter(item => item.type.toLowerCase() === r.type.toLowerCase() && item.quantity >= Number(r.quantity))).map(item => `<article class="match-card"><span class="resource-symbol">${symbol(item.type)}</span><div><h3>${esc(item.quantity + ' ' + item.unit + ' of ' + item.specific)}</h3><p>Provider: ${esc(item.provider)} · Location: ${esc(item.location)}</p><p>${esc(item.details)}</p></div><div class="match-quantity">${item.quantity} ${esc(item.unit)}<small>${esc(item.location)}</small><button class="resource-btn" data-view="details" data-id="${item.id}">View Details</button></div></article>`).join('') || '<div class="empty-state">No exact quantity match yet. Your request is saved and the network will update as resources are offered.</div>'}</div></section>`); };
    const details = item => shell('Resource details', item.specific, 'Review the full offer before choosing whether to connect with this provider.', `<div class="detail-layout"><section class="resource-panel"><div class="connection-state"><i class="resource-live"></i>${esc(item.availability)}</div><div class="detail-list"><div><span>Resource type</span><strong>${esc(item.type)}</strong></div><div><span>Available quantity</span><strong>${item.quantity} ${esc(item.unit)}</strong></div><div><span>Provider</span><strong>${esc(item.provider)}</strong></div><div><span>Location</span><strong>${esc(item.location)}</strong></div></div><div style="margin-top:20px"><span class="eyebrow">Provider details</span><p style="color:var(--muted);font-size:12px">${esc(item.details)}</p></div><div class="form-actions"><button class="resource-btn" data-connect="${item.id}">Connect with provider <span>→</span></button><button class="resource-btn secondary" data-view="matches">Back to matches</button></div></section><aside class="resource-panel"><span class="eyebrow">Your request</span><h2>${esc(state.request?.specific || 'Resource request')}</h2><p class="panel-copy">${state.request ? `${state.request.quantity} ${state.request.unit} needed in ${state.request.location}.` : 'Select a request to see its context.'}</p><div class="activity-item"><strong>Requester chooses</strong><span>No provider is contacted until you select Connect.</span></div></aside></div>`);
    const connection = item => shell('Connection created', 'Connection Details', 'You chose this provider. Coordinate the exchange directly and update the status when complete.', `<div class="detail-layout"><section class="resource-panel"><div class="connection-state" style="background:var(--green-soft);color:var(--green)"><i class="resource-live"></i>Connected · Coordinating</div><div class="detail-list"><div><span>Requested resource</span><strong>${esc(state.request.specific)}</strong></div><div><span>Provider</span><strong>${esc(item.provider)}</strong></div><div><span>Quantity</span><strong>${state.request.quantity} ${esc(state.request.unit)}</strong></div><div><span>Location</span><strong>${esc(item.location)}</strong></div></div><div class="form-actions"><button class="resource-btn" data-view="chat">Open Chat <span>→</span></button><button class="resource-btn secondary" data-view="activity">My Connections</button></div></section><aside class="resource-panel"><span class="eyebrow">Exchange status</span><h2>Coordinating</h2><p class="panel-copy">The provider has not been automatically notified by this demo. Use the private chat to agree on timing and handover.</p><div class="activity-list"><div class="activity-item"><strong>Request submitted</strong><span>Just now · ${esc(state.request.location)}</span></div><div class="activity-item"><strong>Provider selected</strong><span>${esc(item.provider)} · ${esc(item.location)}</span></div></div></aside></div>`);
    const chat = item => shell('Private coordination', 'Open Chat', `A private in-platform conversation with ${item.provider}.`, `<div class="chat-window"><div class="chat-header"><div><strong>${esc(item.provider)}</strong><small>${esc(item.specific)} · ${esc(item.location)}</small></div><div class="connection-state" style="background:var(--green-soft);color:var(--green)"><i class="resource-live"></i>Connected</div></div><div class="chat-messages" id="chatMessages"><div class="chat-bubble">Hello, I can coordinate ${esc(state.request.quantity)} ${esc(state.request.unit)} for your request. We can confirm the handover point here.<small>${esc(item.provider)} · 18:44</small></div><div class="chat-bubble mine">Thank you. I am available to coordinate the exchange in ${esc(state.request.location)}.<small>You · 18:45</small></div></div><form class="chat-compose" id="chatForm"><input name="message" required placeholder="Write a private message..."><button type="submit">Send</button></form></div><div class="form-actions"><button class="resource-btn" data-fulfill="true">Mark as Fulfilled</button><button class="resource-btn secondary" data-view="connection">Back to Connection</button></div>`);
    const activity = () => { const tab = state.activity; const content = tab === 'requests' ? `<article class="resource-card"><span class="resource-symbol">＋</span><div><h3>5 units of O− blood</h3><p>Kathmandu · 2 potential matches · request posted today</p></div><div class="quantity">Active<small>Potential matches</small><button data-view="matches">Review</button></div></article>` : tab === 'available' ? `<article class="resource-card"><span class="resource-symbol">▦</span><div><h3>20 family food packages</h3><p>Offered in Kathmandu · available now</p></div><div class="quantity">Posted<small>My available resource</small></div></article>` : `<article class="resource-card"><span class="resource-symbol">◒</span><div><h3>8 water containers</h3><p>Connected to Maya Relief · chat available</p></div><div class="quantity">Coordinating<small>My connection</small><button data-view="chat">Open Chat</button></div></article>`; return shell('Your resource network', 'My Resource Activity', 'Everything you have requested, offered, connected, chatted about, or fulfilled.', `<section class="resource-panel"><div class="resource-tabs"><button class="resource-tab ${tab === 'requests' ? 'active' : ''}" data-activity="requests">My Requests</button><button class="resource-tab ${tab === 'available' ? 'active' : ''}" data-activity="available">My Available Resources</button><button class="resource-tab ${tab === 'connections' ? 'active' : ''}" data-activity="connections">My Connections</button></div><div class="resource-list">${content}</div></section>`); };
    function render(){ root.innerHTML = state.view === 'home' ? home() : state.view === 'need' || state.view === 'have' ? form(state.view) : state.view === 'matches' ? matches() : state.view === 'details' ? details(state.selected) : state.view === 'connection' ? connection(state.selected) : state.view === 'chat' ? chat(state.selected) : activity(); bind(); }
    function bind(){ root.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { const view = button.dataset.view; if(button.dataset.id) state.selected = resources.find(item => item.id === button.dataset.id); if(view === 'matches' && !state.request) state.request = {type:'Blood',specific:'O− blood',quantity:5,unit:'units',location:'Kathmandu'}; state.view = view; render(); })); root.querySelectorAll('[data-activity]').forEach(button => button.addEventListener('click', () => { state.activity = button.dataset.activity; render(); })); root.querySelectorAll('[data-connect]').forEach(button => button.addEventListener('click', () => { state.selected = resources.find(item => item.id === button.dataset.connect); state.view = 'connection'; render(); })); const formElement = document.getElementById('resourceForm'); if(formElement) formElement.addEventListener('submit', event => { event.preventDefault(); const data = Object.fromEntries(new FormData(formElement)); if(state.view === 'need') { state.request = data; state.view = 'matches'; } else { resources.unshift({...data,id:'new-'+Date.now(),quantity:Number(data.quantity),availability:data.availability || 'Available now',provider:'Alex Sharma'}); state.view = 'home'; } render(); }); const chatForm = document.getElementById('chatForm'); if(chatForm) chatForm.addEventListener('submit', event => { event.preventDefault(); const data = Object.fromEntries(new FormData(chatForm)); const message = document.createElement('div'); message.className = 'chat-bubble mine'; message.innerHTML = `${esc(data.message)}<small>You · now</small>`; document.getElementById('chatMessages').appendChild(message); chatForm.reset(); }); root.querySelectorAll('[data-fulfill]').forEach(button => button.addEventListener('click', () => { button.textContent = 'Fulfilled'; button.disabled = true; })); }
    render();
})();
</script>
</body>
</html>
