<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout Confirmation - Innovision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #eef6eb;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: #dce9dd;
      --text-main: #18332b;
      --text-muted: #6c8178;
      --primary: #317b58;
      --primary-hover: #245d43;
      --danger: #bf514b;
      --danger-hover: #a53f3a;
      --danger-light: #fff0ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 15% 10%, #dcefdc 0, transparent 30%), var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated Background */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite ease-in-out alternate;
    }

    .shape-1 {
      width: 400px;
      height: 400px;
      background: rgba(59, 130, 246, 0.2);
      top: -10%;
      left: -10%;
    }

    .shape-2 {
      width: 300px;
      height: 300px;
      background: rgba(239, 68, 68, 0.15);
      bottom: 10%;
      right: -5%;
      animation-delay: -5s;
    }
    
    .shape-3 {
      width: 250px;
      height: 250px;
      background: rgba(139, 92, 246, 0.15);
      top: 40%;
      left: 50%;
      animation-duration: 15s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, 50px) rotate(20deg); }
    }

    /* Glassmorphism Card */
    .modal-container {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(34, 74, 54, 0.14);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--danger-light);
      border-radius: 50%;
      color: var(--danger);
      position: relative;
    }
    
    .icon-container::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(191, 81, 75, 0.18);
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.5; }
    }

    .icon-container svg {
      width: 40px;
      height: 40px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    button {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 500;
      padding: 14px 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-logout {
      background-color: var(--danger);
      color: white;
      box-shadow: 0 8px 18px rgba(191, 81, 75, 0.22);
    }

    .btn-logout:hover {
      background-color: var(--danger-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(191, 81, 75, 0.28);
    }

    .btn-cancel {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-cancel:hover {
      background-color: #f6faf3;
      border-color: #b9d7bd;
    }

    /* Loading Spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading .spinner {
      display: block;
    }
    .loading .btn-text, .loading .btn-icon {
      display: none;
    }
    .loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .logout-brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:28px; color:#163c2d; font:700 20px/1.12 'Space Grotesk',sans-serif; }
    .logo-mark { display:grid; place-items:center; width:38px; height:38px; color:#163c2d; background:#b7e36f; border-radius:11px 11px 11px 3px; transform:rotate(-5deg); }
    .logo-symbol { transform:none; font:700 18px/1 'Space Grotesk',sans-serif; letter-spacing:-.04em; }

    @media (min-width: 480px) {
      .button-group {
        flex-direction: row;
      }
      .btn-cancel {
        order: -1;
      }
    }
   .logo-mark .logo-symbol,.brand-mark .brand-symbol{display:block;width:21px;height:21px;transform:none;color:currentColor}</style>
<link rel="stylesheet" href="css/brand.css">
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <main class="modal-container">
    <a class="logout-brand" href="landingpage.html"><span class="logo-mark" aria-hidden="true"><svg class="logo-symbol" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C12 4 5 8 4 19c6-1 11-5 16-15Z"></path><path d="M4 19c4-4 7-7 12-10"></path></svg></span><span>khetRakshak</span></a>
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>
    
    <h1>Ready to Leave?</h1>
    <p>You are about to securely log out of your account. Any unsaved changes might be lost.</p>

    <div class="button-group">
      <button class="btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn-logout" id="btnLogout">
        <span class="spinner"></span>
        <span class="btn-text">Yes, Log Out</span>
      </button>
    </div>
  </main>

  <script>
    document.getElementById('btnCancel').addEventListener('click', () => {
      // Simulate going back
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'dashboard.html'; 
      }
    });

    document.getElementById('btnLogout').addEventListener('click', function() {
      this.classList.add('loading');
      
      // Simulate API call and redirect
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    });
  </script>
</body>
</html>
